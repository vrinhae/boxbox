[project]
name = "pitwall"
version = "0.1.0"
description = "Multi-agent LLM system for lap-by-lap F1 pit-stop decisions"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "openai>=1.40",  # OpenRouter uses the OpenAI-compatible API
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "baselines*", "data*", "eval*", "sim*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
